[project]
name = "xacct"
version = "1.0.0"
description = "Assume a cross-account CI/CD role with an External ID, and prove it is locked down"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # fake passwords/tokens in test data

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
